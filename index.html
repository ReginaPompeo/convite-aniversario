<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Meu Aniversário ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Rye&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ==========================================
         CONVITE
    =========================================== -->

    <main class="convite">
      <div class="textura"></div>

      <div class="decoracao decoracao-1">✦</div>
      <div class="decoracao decoracao-2">♡</div>
      <div class="decoracao decoracao-3">✦</div>

      <div class="conteudo">
        <p class="save-date">SAVE THE DATE</p>

        <h1>
          Meu<br />
          Aniversário
        </h1>

        <div class="idade">23</div>

        <p class="anos">ANOS</p>

        <div class="ornamento">
          <span>♡</span>
          <i></i>
          <span>✦</span>
          <i></i>
          <span>♡</span>
        </div>

        <!-- DATA -->

        <div class="data">
          <span class="rotulo">DATA</span>

          <strong>05 DE SETEMBRO</strong>

          <span class="dia">SÁBADO</span>
        </div>

        <!-- HORÁRIO -->

        <div class="horario">
          <span class="rotulo">À NOITE</span>

          <strong>19:00</strong>
        </div>

        <!-- LOCAL -->

        <div class="local">
          <span class="rotulo">LOCAL</span>

          <strong> Av. Eng. Caetano Álvares, 4358 </strong>

          <span> Chora Menino · São Paulo — SP </span>

          <span class="cep"> 02413-000 </span>
        </div>

        <p class="frase">
          Coloque sua melhor bota<br />
          e vem comemorar comigo! 🤎
        </p>

        <!-- BOTÕES -->

        <div class="botoes">
          <button class="botao confirmar" onclick="confirmarPresenca()">
            ♡ &nbsp; CONFIRMAR PRESENÇA
          </button>

          <a
            class="botao mapa"
            href="https://www.google.com/maps/search/?api=1&query=Av.+Eng.+Caetano+Álvares,+4358,+Chora+Menino,+São+Paulo,+SP"
            target="_blank"
            rel="noopener noreferrer"
          >
            ⌖ &nbsp; COMO CHEGAR
          </a>
        </div>

        <p class="rodape">Espero você! 🌸</p>
      </div>
    </main>

    <!-- ==========================================
     ABERTURA FAROESTE
========================================== -->

    <div class="entrada">
      <!-- Luz do saloon atrás das portas -->
      <div class="luz-saloon"></div>

      <!-- Plaquinha que aparece depois que as portas abrem -->
      <div class="placa-saloon">
        <div class="estrela-placa">★</div>

        <span>BEM-VINDO(A)</span>

        <strong>AO SALOON</strong>

        <div class="linha-placa">
          <i></i>
          <b>♡</b>
          <i></i>
        </div>
      </div>

      <!-- PORTA ESQUERDA -->

      <div class="porta porta-esquerda">
        <div class="tabuas">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="moldura-porta"></div>

        <div class="puxador">♡</div>
      </div>

      <!-- PORTA DIREITA -->

      <div class="porta porta-direita">
        <div class="tabuas">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="moldura-porta"></div>

        <div class="puxador">♡</div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
